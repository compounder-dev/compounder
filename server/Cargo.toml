[package]
name = "compounder-server"
version = "0.1.0"
edition = "2021"

[dependencies]
compounder-engine = { path = "../engine" }
# Funds running live on paper: their ledgers and tests, read from the desk's folder.
compounder-desk = { path = "../desk", default-features = false }
# The price store and the calendar, without the feed that fills the store.
compounder-prices = { path = "../prices", default-features = false }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
