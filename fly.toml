app = "compounder"
primary_region = "jnb"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DESK_DIR = "/data/desk"
  AUTH_DIR = "/data/auth"
  PRICE_STORE = "/data/prices"

[[mounts]]
  source = "compounder_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The desk trades around the clock, so the machine never sleeps.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
