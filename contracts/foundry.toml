[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc = "0.8.24"
# The contract remembers a fund's value for one transaction only, which needs this version.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The live check reads a route fetched moments earlier.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 512
